<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🔍 SEO Tags (Google Indexing के लिए सबसे ज़रूरी) -->
    <title>RtiTracker - उत्तर प्रदेश का स्मार्ट RTI मैनेजर (Coming Soon)</title>
    <meta name="description" content="यूपी में अपनी RTI, प्रथम अपील और द्वितीय अपील को आसानी से ट्रैक करें। RtiTracker.in जल्द आ रहा है।">
    <meta name="keywords" content="RTI tracker UP, RTI appeal status, RTI online UP, Bareilly RTI, myrtitracker">
    <meta name="robots" content="index, follow">
    
    <!-- Tailwind CSS (खूबसूरत डिज़ाइन के लिए) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">

    <!-- मेन कंटेनर -->
    <div class="bg-white p-10 rounded-2xl shadow-2xl text-center max-w-lg w-[90%] border-t-4 border-blue-600">
        
        <!-- लोगो / ब्रांड नेम -->
        <h1 class="text-4xl font-extrabold text-blue-700 mb-2">RtiTracker<span class="text-orange-500">.in</span></h1>
        
        <!-- टैगलाइन -->
        <h2 class="text-2xl font-bold text-gray-800 mb-4 mt-6">🚀 Coming Soon</h2>
        <p class="text-gray-600 text-lg mb-8 leading-relaxed">
            उत्तर प्रदेश और भारत के अन्य राज्यों के लिए पहला ऑटोमैटिक आरटीआई और अपील मैनेजर बन रहा है। 
            <br><span class="text-sm font-semibold text-blue-500 mt-2 block">काम प्रगति पर है...</span>
        </p>
<!-- नया और बेहतर वेटलिस्ट फ़ॉर्म (बिना कटने वाली सेटिंग के साथ) -->
<div class="mt-6 px-4 w-full">
  
  <!-- 1. आकर्षक ऑफर टेक्स्ट - इसे हमने फॉर्म से बाहर सबसे ऊपर कर दिया है ताकि ये किसी को डिस्टर्ब न करे -->
  <p class="text-sm text-gray-600 text-center mb-4 block w-full leading-relaxed">
    अभी रजिस्टर करें और वेबसाइट लॉन्च होने पर पाएं 3 महीने का प्रीमियम एक्सेस बिल्कुल फ्री! 🔥
  </p>

  <!-- 2. असली फ़ॉर्म कंटेनर (जो सिर्फ इनपुट बॉक्स और बटन को संभालता है) -->
  <form id="waitlistForm" class="flex flex-col sm:flex-row items-center justify-center gap-3 w-full max-w-md mx-auto">
    
    <!-- ईमेल इनपुट बॉक्स -->
    <input type="email" id="userEmail" placeholder="name@example.com" required 
           class="w-full sm:flex-1 px-4 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-base shadow-sm" />
    
    <!-- सबमिट बटन (whitespace-nowrap की वजह से इसका टेक्स्ट कभी नहीं टूटेगा) -->
    <button type="submit" id="submitBtn" 
            class="w-full sm:w-auto bg-orange-500 hover:bg-orange-600 text-white font-medium px-5 py-2.5 rounded-xl transition duration-200 whitespace-nowrap shadow-sm">
      अपना फ्री प्रीमियम पास लें 🎟️
    </button>

  </form>

  <!-- 3. सफलता / डुप्लीकेट अलर्ट मैसेज दिखाने के लिए सुरक्षित जगह -->
  <div id="msg" class="mt-3 text-center text-sm font-semibold hidden"></div>

  <!-- 4. आपके नीचे वाले सुंदर तीन डॉट्स (पेज इंडिकेटर) जो अब एकदम सेंटर में नीचे दिखेंगे -->
  <div class="flex justify-center gap-1.5 mt-5">
    <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
    <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span>
    <span class="w-2.5 h-2.5 rounded-full bg-slate-800"></span>
  </div>

</div>

<script type="module" src="script.js"></script>

        <!-- लोडर एनिमेशन (दिखने में प्रो लगता है) -->
        <div class="flex justify-center items-center space-x-2">
            <div class="w-3 h-3 bg-blue-600 rounded-full animate-bounce"></div>
            <div class="w-3 h-3 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0.1s;"></div>
            <div class="w-3 h-3 bg-gray-800 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
        </div>
        
    </div>

</body>
</html>
